name: NAF_INR_LowLightTraffic
model_type: NAFNetModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 42

datasets:
  test:
    name: LowLightTraffic
    type: PairedImageDataset
    dataroot_gt: ../Dataset/LowLightTraffic/Gt
    dataroot_lq: ../Dataset/LowLightTraffic/Lq
    io_backend:
      type: disk


# network structures
network_g:
  type: NAF_Baseline_INR
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 8
  dec_blk_nums: [1, 1, 1, 1]
  inr_d: 64
  context_dim: 256
  dw_expand: 1
  ffn_expand: 2
  degradation_types: 20

# path
path:
  pretrain_network_g: experiments/pretrained_models/net_g_107000.pth
  strict_load_g: true

# validation settings
val:
  val_freq: 1000
  save_img: true
  save_vis: false  # 🆕 新增：是否保存频域分解的可视化结果
  save_vis_freq: ~  # 🆕 新增：频域分解可视化结果保存频率
  max_val_num: 20000  # 🆕 新增：最大验证图像数量

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
