name: NAF-base-test
model_type: NAFNetModel
scale: 1
num_gpu: 1 # set num_gpu: 0 for cpu mode
manual_seed: 42

datasets:
  test_1:
    name: RSCityscapes
    type: PairedImageDataset
    dataroot_gt: ../Dataset/RSCityscapes/Gt
    dataroot_lq: ../Dataset/RSCityscapes/Lq
    io_backend:
      type: disk

# network structures
network_g:
  type: NAF_Baseline
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  dw_expand: 2
  ffn_expand: 2

# path
path:
  pretrain_network_g: experiments/NAF-base/models/net_g_153000.pth
  strict_load_g: true

# validation settings
val:
  val_freq: 1000
  save_img: true
  save_vis: false
  save_vis_freq: ~
  max_val_num: 2000
  suffix: ~ # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
